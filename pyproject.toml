[build-system]
requires = ["scikit-build-core"]
build-backend = "scikit_build_core.build"

[project]
name = "pydeform"
version = "0.5.2"
description = ""
readme = "README.md"
authors = [
    { name = "Simon Ekström" },
]
dependencies = [
    "numpy",
    "python-stk",
    "PyYAML",
]

[tool.scikit-build]
sdist.include = ["third_party/stk/third_party/zlib/zconf.h"]

[tool.scikit-build.cmake.define]
DF_BUILD_EXECUTABLE = "OFF"
