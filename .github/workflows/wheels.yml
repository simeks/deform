name: Wheels

on:
  push:
    branches: [development]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build ${{ matrix.package.name }} wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15 builds arm64 wheels, macos-15-intel builds x86_64 wheels
        os: [ubuntu-latest, windows-latest, macos-15, macos-15-intel]
        # python-stk is built from the submodule, so that the wheels match
        # the version pydeform was built and tested against
        package:
          - { name: pydeform, dir: . }

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pypa/cibuildwheel@v4.3.1
        with:
          package-dir: ${{ matrix.package.dir }}

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.package.name }}-${{ matrix.os }}
          path: wheelhouse/*.whl
